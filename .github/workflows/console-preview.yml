# Builds the console preview (the static page that visualizes agent runs),
# verifies the published output, and uploads it as a `console-dist` artifact
# that can be published to any static host — Vercel and GitHub Pages included.
#
# The built page has no backend of its own: it reads the ASTRO service running
# on the visitor's machine (default http://127.0.0.1:5678, overridable with
# `?api=`). The service must allow the deployment's origin — see
# `ASTRO_CORS_ORIGINS` in server/server.mjs and the user manual's "部署预览页
# 面" section.
#
# Triggers:
#   - push to the rolling-preview feature branch -> build + verify + upload
#     + deploy to Pages (live preview of the in-flight branch without merging;
#     remove it from the list once the branch is merged/deleted)
#   - pull request to `main`     -> build + verify + upload (no deploy)
#   - workflow_dispatch (any branch) -> build + verify + upload + deploy to
#     Pages from that branch's tip (manual override, e.g. to re-publish a
#     branch that is no longer a push trigger)
#
# `main` is NOT a trigger here: the formal release channel is
# `docs-site.yml`, which deploys the merged output (docs site at the root,
# the console under /console/) to Pages on every push to `main`. This
# workflow stays the rolling preview for in-flight branches, so the shared
# Pages site is not flipped back and forth between a console-only build and
# the merged release build.

name: Build console preview

on:
  push:
    # The feature branch is the rolling-preview test target for the
    # in-flight work; delete it from the list when that branch merges.
    branches: [feat/demo-dataset-from-local-service]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: console-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Install, build and verify console preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build console
        run: pnpm build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/data/demo-events.json
          echo "Published output:"
          ls dist
          ls dist/data
          node scripts/verify-console-build.mjs

      - name: Upload console build
        uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: dist
          retention-days: 7

  deploy-pages:
    name: Deploy console preview to GitHub Pages
    needs: build
    # Publishing happens on push to the rolling-preview feature branch, plus a
    # manual dispatch from any branch. Pushes to `main` publish the merged
    # docs + console release instead (docs-site.yml). The Pages site is a
    # single rolling target: the most recent qualifying build wins.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        github.ref == 'refs/heads/feat/demo-dataset-from-local-service')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download console build
        uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
