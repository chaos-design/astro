# Builds the console preview (the static page that visualizes agent runs),
# verifies the published output, and uploads it as a `console-dist` artifact
# that can be published to any static host — Vercel and GitHub Pages included.
#
# The built page has no backend of its own: it reads the ASTRO service running
# on the visitor's machine (default http://127.0.0.1:5678, overridable with
# `?api=`). The service must allow the deployment's origin — see
# `ASTRO_CORS_ORIGINS` in server/server.mjs and the user manual's "部署预览页
# 面" section.
#
# Triggers:
#   - push to `main`             -> build + verify + upload + deploy to Pages
#   - push to a `feat/**`, `feature/**`, `fix/**` or `hotfix/**` branch ->
#     build + verify + upload +
#     deploy to Pages (live preview of every in-flight branch without merging;
#     the Pages site is a single rolling target, so the newest push wins)
#   - pull request to `main`     -> build + verify + upload (no deploy)
#   - workflow_dispatch (any branch) -> build + verify + upload + deploy to
#     Pages from that branch's tip (manual override, e.g. to re-publish a
#     branch that is no longer a push trigger)
#
# The Pages job publishes only the *console* artifact (never the docs site): a
# repository has a single Pages site, and this repo also documents a docs-site
# path (Vercel, via `vercel.json` + `scripts/merge-deploy-output.mjs`) —
# deploy one or the other, not both. It publishes the *triggering branch's*
# build (no main-only gate), so the most recent push wins on the shared site.

name: Build console preview

on:
  push:
    # `main` is the formal release. The branch filters are globs, so a new
    # `feat/*`, `feature/*`, `fix/*` or `hotfix/*` branch publishes without
    # editing this file.
    branches: [main, "feat/**", "feature/**", "fix/**", "hotfix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# CI race: a newly triggered run cancels every in-flight run of this workflow
# across *all* branches — not just same-ref ones — so a slower, older build can
# no longer overtake a fresher result.
#
# The group is ref-agnostic on purpose: with `cancel-in-progress: true` the
# superseded run is terminated the moment a newer one enqueues. A per-ref group
# (`${{ github.ref }}`) would only cancel runs on the *same* ref, leaving
# cross-branch builds racing into the one shared Pages site.
#
# PR builds sit in their own `pr` lane so they never cancel the
# deploy-triggering push/dispatch runs: a feature branch that has an open PR
# would otherwise lose its Pages preview, because the PR run (which never
# deploys) enqueues just after the push run and cancels it. Push and manual
# dispatches share the `run` lane, where the newest trigger wins.
concurrency:
  group: console-preview-ci-${{ github.event_name == 'pull_request' && 'pr' || 'run' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Install, build and verify console preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build console
        run: pnpm build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/data/demo-events.json
          echo "Published output:"
          ls dist
          ls dist/data
          node scripts/verify-console-build.mjs

      - name: Upload console build
        uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: dist
          retention-days: 7

  deploy-pages:
    name: Deploy console preview to GitHub Pages
    needs: build
    # Publishing happens on push to the production branch (`main`), on push to
    # any `feat/**`, `feature/**`, `fix/**` or `hotfix/**` branch, plus a manual
    # dispatch from any branch.
    # The Pages site is a single rolling target: the most recent qualifying
    # build wins, so a feature or fix branch gets a live preview URL without
    # merging to main. Prefix matching (`startsWith`) mirrors the `branches`
    # globs above so a new branch needs no workflow edit.
    #
    # Concurrency has two layers. The workflow-level group (above) is
    # ref-agnostic, so a newly triggered run cancels *every* in-flight run of
    # this workflow across all branches — the CI race: the newest trigger
    # wins and no slower, older build can outlive it. PR builds sit in their
    # own lane (the group ends in `-pr`), so they verify without racing the
    # deploy-triggering push/dispatch runs that share the `-run` lane. The
    # job-level group below is a second, deploy-only belt: even if two deploys
    # ever reach the queue, they serialize against one another and a
    # superseded one is cancelled, so a stale build must not overwrite a newer
    # Pages page.
    concurrency:
      group: console-preview-pages
      cancel-in-progress: true
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         startsWith(github.ref, 'refs/heads/feat/') ||
         startsWith(github.ref, 'refs/heads/feature/') ||
         startsWith(github.ref, 'refs/heads/fix/') ||
         startsWith(github.ref, 'refs/heads/hotfix/')))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download console build
        uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # A deploy that fails after uploading (a transient artifact-metadata
      # hiccup) leaves its `github-pages` artifact behind, and re-running the
      # job uploads a second one — deploy-pages refuses ambiguity ("Multiple
      # artifacts named github-pages") and every later rerun keeps failing on
      # it. Clear the run's stale Pages artifacts first so a rerun is
      # self-healing: exactly one upload survives for deploy-pages to find.
      - name: Remove stale Pages artifacts from earlier attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id')"
          for id in $ids; do
            echo "Deleting stale github-pages artifact $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # The upload returns once the artifact is finalized, but the
      # ListArtifacts metadata that deploy-pages reads is eventually
      # consistent, and the GitHub API itself is occasionally transiently
      # unreachable. Two observed failure modes for the same symptom
      # ("No artifacts named github-pages were found" / "Fetching artifact
      # metadata failed"):
      #   - a fresh upload whose listing is not yet visible when
      #     deploy-pages queries (on 2026-11-23 the upload succeeded and,
      #     ~400 ms later, deploy-pages saw only `console-dist`), and
      #   - a transient GitHub Pages / Actions API outage (2026-11-24:
      #     "Is githubstatus.com reporting issues … re-run the deployment").
      # The cleanup above makes any `github-pages` artifact in this run the
      # one just uploaded, so the only thing left to wait for is the listing
      # settling. Poll the *same* endpoint deploy-pages reads, with backoff,
      # and require **two consecutive clean, non-empty reads** before
      # returning: one success can be the tail of a transient error window,
      # and a `gh api` failure is swallowed (`|| true`) so it reads as "not
      # visible yet" and retries instead of aborting. A genuinely missing
      # upload still fails loudly after the budget instead of hanging.
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          seen_successive=0
          # 24 attempts, 5s then 10s then capped at 20s backoff: ~4 minutes.
          for attempt in $(seq 1 24); do
            ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages") | .id' 2>/dev/null || true)"
            if [ -n "$ids" ]; then
              seen_successive=$((seen_successive + 1))
              echo "Pages artifact metadata visible (id $ids, ${seen_successive}/2 consecutive)"
              if [ "$seen_successive" -ge 2 ]; then
                echo "Stable read confirmed; proceeding to deploy"
                exit 0
              fi
            else
              # A transient API error reads as "not visible": reset the
              # consecutive counter so we never leave on a single flaky hit.
              seen_successive=0
              echo "Pages artifact metadata not visible ($attempt/24), retrying"
            fi
            case "$attempt" in
              1 | 2 | 3 | 4 | 5) sleep 5 ;;
              6 | 7 | 8 | 9 | 10) sleep 10 ;;
              *) sleep 20 ;;
            esac
          done
          echo "Pages artifact never reached a stable read in the run metadata" >&2
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
