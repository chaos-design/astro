# Builds the docs/ static site and deploys it to Vercel.
#
# Triggers:
#   - push to `main`            -> production deploy (`vercel deploy --prod`)
#   - pull request to `main`    -> preview deploy
#
# Required repository secrets (GitHub -> Settings -> Secrets and variables -> Actions):
#   - VERCEL_TOKEN:       Vercel account token (Vercel dashboard -> Account Settings -> Tokens)
#   - VERCEL_ORG_ID:     Vercel team/organization id (Dashboard -> team name -> Settings -> General)
#   - VERCEL_PROJECT_ID: id of the docs site project (project dashboard -> Settings -> General)
#
# The Vercel project should be created by importing this repository with
# framework preset "Other"; vercel.json supplies install/build commands and the
# static output directory, so no further project build settings are needed.

name: Deploy docs site to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: docs-vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  build:
    name: Install, build and verify docs site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: pnpm build:docs

      - name: Verify build output
        run: |
          test -f docs/dist/index.html
          echo "Published pages:"
          ls docs/dist

      - name: Upload docs build
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/dist
          retention-days: 7

  deploy:
    name: Deploy to Vercel
    needs: build
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: pnpm build:docs

      - name: Check Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=("VERCEL_TOKEN")
          [ -n "${VERCEL_ORG_ID:-}" ] || missing+=("VERCEL_ORG_ID")
          [ -n "${VERCEL_PROJECT_ID:-}" ] || missing+=("VERCEL_PROJECT_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing Vercel secrets: ${missing[*]}"
            echo "Add them under GitHub -> Settings -> Secrets and variables -> Actions, then re-run this workflow."
            exit 1
          fi
          echo "Vercel secrets are configured."

      - name: Deploy preview to Vercel
        if: github.event_name == 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel deploy --yes --verbose

      - name: Deploy production to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel deploy --prod --yes --verbose
