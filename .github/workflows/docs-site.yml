# Builds the docs site (site/ React+Vite SPA over docs/), verifies the
# published output, and uploads it as a `docs-dist` artifact that can be
# published to any static host.
#
# Triggers:
#   - push to `main`          -> build + verify + upload
#   - pull request to `main`  -> build + verify + upload
#
# A separate Vercel deployment is not part of this workflow; `vercel.json`
# is kept at the repository root so the same build can be deployed manually
# via Vercel if desired.

name: Build docs site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: docs-site-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Install, build and verify docs site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: pnpm build:docs

      - name: Verify build output
        run: |
          test -f site/dist/index.html
          test -f site/dist/decks/project-overview-slides-zh.html
          echo "Published output:"
          ls site/dist
          ls site/dist/decks

      - name: Upload docs build
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: site/dist
          retention-days: 7
